name: CI

on:
  push:
    branches: [main, feat/full-lom-api]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Format check (all Python files)
        run: uv run --extra dev ruff format --check .
      - name: Byte-compile remote script
        run: python3 -m py_compile ableton_live_mcp/remote_script/__init__.py
      - name: Validate pinned official API inventory (offline)
        run: python3 scripts/sync_lom_inventory.py
      - name: Validate full LOM coverage ledger (offline)
        run: uv run --frozen --extra dev python scripts/audit_lom_coverage.py --check

  test:
    runs-on: ubuntu-latest
    env:
      ABLETON_PORT: "1"
      ABLETON_MAX_PORT: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests
        run: uv run --extra dev pytest -q
